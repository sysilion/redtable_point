<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171a1f" media="(prefers-color-scheme: dark)">
  <meta name="description" content="레드테이블·영등포구청·베네피아 제휴 맛집을 지도 한 장에서 찾아보세요.">
  <title>Red Table Map</title>
  <style>
    :root {
      /* 카테고리 색 — 지도 마커가 JS 로 --cat-*-bg 를 직접 읽는다. 이름 변경 금지 */
      --cat-한식-bg: #FFF3E0; --cat-한식-text: #E65100;
      --cat-양식-bg: #E8F5E9; --cat-양식-text: #2E7D32;
      --cat-카페-bg: #FFF8E1; --cat-카페-text: #A96400;
      --cat-중식-bg: #FBE9E7; --cat-중식-text: #BF360C;
      --cat-뷰티-bg: #FCE4EC; --cat-뷰티-text: #C2185B;
      --cat-일식-bg: #E3F2FD; --cat-일식-text: #1565C0;
      /* 베이커리는 뷰티와 같은 분홍이라 지도에서 구분이 안 됐다. 보라로 분리 */
      --cat-베이커리-bg: #F3E5F5; --cat-베이커리-text: #7B1FA2;
      --cat-서프샵-bg: #E0F2F1; --cat-서프샵-text: #00695C;
      --cat-기타-bg: #F1F3F5; --cat-기타-text: #5A6572;

      /* 매장 상태 — 주간 갱신에서 새로 들어왔거나 목록에서 빠진 매장.
         마커 링 색은 JS 가 --status-*-ring 을 직접 읽는다. 이름 변경 금지 */
      --status-new-ring: #16a34a;
      --status-new-bg: #DCFCE7; --status-new-text: #15803D;
      --status-gone-ring: #94a3b8;
      /* 마커는 밝은 지도 타일 위에만 그려지므로 다크 모드에서도 이 값을 쓴다 */
      --status-gone-fill: #E2E7EC;
      --status-gone-bg: #E9EDF2; --status-gone-text: #64748B;

      /* 레이아웃 */
      --sidebar-w: 380px;
      --sheet-collapsed-h: 76px; /* JS 의 스냅 타깃과 값을 맞춰야 한다 */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --space-xl: 24px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 999px;
      --sheet-radius-top: 20px;

      /* 색 */
      --bg: #eef1f5;
      --surface: #ffffff;
      --surface-2: #f4f6f8;
      --surface-hover: #f0f2f5;
      --text: #14171a;
      --text-2: #596573;
      --text-3: #8b949e;
      --border: #e4e8ec;
      --border-strong: #d3d9e0;
      --accent-color: #e74c3c;
      --accent-strong: #c0392b;
      --accent-soft: rgba(231, 76, 60, 0.12);
      --nav-bg: rgba(255, 255, 255, 0.82);
      --sheet-bg: #f7f8fa;
      --scrim: rgba(20, 23, 26, 0.55);

      --shadow-soft: 0 1px 2px rgba(16, 24, 40, 0.04), 0 4px 14px rgba(16, 24, 40, 0.07);
      --shadow-raise: 0 2px 4px rgba(16, 24, 40, 0.06), 0 12px 28px rgba(16, 24, 40, 0.13);
      --shadow-sheet: 0 -6px 28px rgba(16, 24, 40, 0.16);

      --font-sans: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard Variable', Pretendard, 'Segoe UI', Roboto, 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior: none;
    }

    #map { width: 100%; height: 100%; background: var(--surface-2); }

    :where(button, input, a):focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    /* ── 카테고리 토큰 ────────────────────────────────────────────
       .cat-* 는 색을 칠하지 않고 변수만 넘긴다. 배지·필·카드가 같은 값을
       각자 다른 방식으로 쓰기 때문. */
    .cat-한식 { --chip-bg: var(--cat-한식-bg); --chip-fg: var(--cat-한식-text); }
    .cat-양식 { --chip-bg: var(--cat-양식-bg); --chip-fg: var(--cat-양식-text); }
    .cat-카페 { --chip-bg: var(--cat-카페-bg); --chip-fg: var(--cat-카페-text); }
    .cat-중식 { --chip-bg: var(--cat-중식-bg); --chip-fg: var(--cat-중식-text); }
    .cat-뷰티 { --chip-bg: var(--cat-뷰티-bg); --chip-fg: var(--cat-뷰티-text); }
    .cat-일식 { --chip-bg: var(--cat-일식-bg); --chip-fg: var(--cat-일식-text); }
    .cat-베이커리 { --chip-bg: var(--cat-베이커리-bg); --chip-fg: var(--cat-베이커리-text); }
    .cat-서프샵 { --chip-bg: var(--cat-서프샵-bg); --chip-fg: var(--cat-서프샵-text); }
    .cat-기타 { --chip-bg: var(--cat-기타-bg); --chip-fg: var(--cat-기타-text); }
    .st-new { --chip-bg: var(--status-new-bg); --chip-fg: var(--status-new-text); }
    .st-gone { --chip-bg: var(--status-gone-bg); --chip-fg: var(--status-gone-text); }

    .category-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: -0.01em;
      background: var(--chip-bg, var(--cat-기타-bg));
      color: var(--chip-fg, var(--cat-기타-text));
    }
    .badge-row { display: flex; flex-wrap: wrap; gap: var(--space-xs); }

    /* ── 상단 내비게이션 ─────────────────────────────────────── */
    .top-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1100;
      padding: var(--space-sm) var(--space-md) var(--space-xs);
      padding-top: calc(var(--space-sm) + env(safe-area-inset-top, 0px));
      background: var(--nav-bg);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-xs);
    }

    .nav-brand { display: none; }

    .floating-search {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      width: 100%;
      max-width: 600px;
      padding: 0 var(--space-md);
      height: 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-soft);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .floating-search:focus-within {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .search-icon { font-size: 14px; opacity: 0.55; flex-shrink: 0; }
    .floating-search input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 16px; /* iOS 확대 방지 최소값 */
      color: var(--text);
    }
    .floating-search input::placeholder { color: var(--text-3); }
    .floating-search input::-webkit-search-cancel-button,
    .floating-search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
    .floating-search button {
      flex-shrink: 0;
      width: 24px; height: 24px;
      border: none;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--text-2);
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .floating-search button:hover { background: var(--border-strong); color: var(--text); }

    /* 스크롤 가능한 필 행. 양끝 페이드로 더 있다는 걸 알린다 */
    .category-pill-row {
      display: flex;
      gap: var(--space-xs);
      width: 100%;
      max-width: 600px;
      padding: var(--space-sm) var(--space-md);
      margin: 0 calc(-1 * var(--space-md));
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
      mask-image: linear-gradient(to right, transparent 0, #000 8px, #000 calc(100% - 24px), transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 8px, #000 calc(100% - 24px), transparent 100%);
    }
    .category-pill-row::-webkit-scrollbar { display: none; }

    .category-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      min-height: 34px;
      padding: 0 var(--space-md);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--text-2);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      scroll-snap-align: start;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }
    .category-pill .pill-emoji { font-size: 14px; line-height: 1; }
    .pill-count {
      min-width: 16px;
      padding: 0 4px;
      border-radius: var(--radius-pill);
      background: var(--surface-2);
      color: var(--text-3);
      font-size: 10px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    .category-pill.active .pill-count {
      background: rgba(0, 0, 0, 0.10);
      color: inherit;
    }
    /* 상태 필터와 음식 카테고리는 성격이 다르다. 같은 줄에 두되 선을 긋는다 */
    .pill-divider {
      flex-shrink: 0;
      align-self: center;
      width: 1px;
      height: 18px;
      margin: 0 2px;
      background: var(--border-strong);
    }
    .pill-reset {
      flex-shrink: 0;
      min-height: 34px;
      padding: 0 var(--space-md);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--text-2);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .pill-reset:hover { background: var(--surface-hover); color: var(--text); }
    .category-pill:hover { background: var(--surface-hover); color: var(--text); }
    .category-pill:active { transform: scale(0.96); }
    .category-pill.active {
      background: var(--chip-bg, var(--surface-2));
      color: var(--chip-fg, var(--text));
      border-color: var(--chip-fg, var(--border-strong));
      font-weight: 700;
    }
    @supports (color: color-mix(in oklab, red, blue)) {
      .category-pill.active {
        background: color-mix(in oklab, var(--chip-fg) 13%, var(--surface));
        border-color: color-mix(in oklab, var(--chip-fg) 38%, transparent);
      }
    }

    /* ── 하단 시트 / 사이드바 목록 ───────────────────────────── */
    .bottom-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 1200;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 88vh;
      padding: var(--space-sm) var(--space-md) 0;
      background: var(--sheet-bg);
      border-radius: var(--sheet-radius-top) var(--sheet-radius-top) 0 0;
      box-shadow: var(--shadow-sheet);
      transition: transform 0.4s var(--ease-sheet);
    }

    /* flex-shrink: 0 필수 — 내용이 많으면 flex 컨테이너가 핸들을 0px로 압축해 보이지 않게 됨 */
    .sheet-handle {
      flex-shrink: 0;
      position: relative;
      width: 140px;
      height: 22px;
      margin: 0 auto;
      cursor: grab;
      touch-action: none;
    }
    .sheet-handle:active { cursor: grabbing; }
    .sheet-handle::before {
      content: '';
      position: absolute;
      top: 8px; left: 50%;
      transform: translateX(-50%);
      width: 40px; height: 4px;
      border-radius: 2px;
      background: var(--border-strong);
      transition: background 0.15s ease, width 0.15s ease;
    }
    .sheet-handle:hover::before { background: var(--text-3); width: 52px; }
    .sheet-handle:focus-visible { outline: 2px solid var(--accent-color); outline-offset: 2px; border-radius: 4px; }

    .sheet-header {
      flex-shrink: 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-sm);
      padding: var(--space-xs) var(--space-xs) var(--space-md);
    }
    .sheet-title {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .sheet-store-count {
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 700;
    }
    .data-date { font-size: 11px; color: var(--text-3); white-space: nowrap; }

    /* 이번 갱신 요약 — 지도를 보기 전에 무엇이 달라졌는지 먼저 알려 준다 */
    .update-summary {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-xs);
      margin: 0 var(--space-xs) var(--space-sm);
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      font-size: 12px;
      color: var(--text-2);
    }
    .update-summary[hidden] { display: none; }
    .update-summary .summary-label { font-weight: 700; color: var(--text); }
    .summary-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      background: var(--chip-bg);
      color: var(--chip-fg);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s ease, border-color 0.15s ease;
    }
    .summary-chip:hover { filter: brightness(0.96); }
    .summary-chip[aria-pressed="true"] { border-color: currentColor; }

    .sheet-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0 var(--space-xs) calc(var(--space-lg) + env(safe-area-inset-bottom, 0px));
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }
    .sheet-content::-webkit-scrollbar { width: 8px; }
    .sheet-content::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
    .sheet-content::-webkit-scrollbar-track { background: transparent; }

    .sheet-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      padding: 48px var(--space-lg);
      color: var(--text-3);
      text-align: center;
    }
    .sheet-empty .empty-icon { font-size: 32px; opacity: 0.7; }
    .sheet-empty strong { font-size: 14px; color: var(--text-2); font-weight: 600; }
    .sheet-empty span { font-size: 12px; }
    .sheet-empty .pill-reset { margin-top: var(--space-sm); }

    /* ── 매장 카드 ──────────────────────────────────────────── */
    .store-card {
      position: relative;
      display: flex;
      gap: var(--space-md);
      width: 100%;
      padding: var(--space-md);
      margin-bottom: var(--space-sm);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: linear-gradient(to right, var(--chip-fg, var(--border-strong)) 3px, var(--surface) 3px);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .store-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-soft); }
    /* 신규는 초록 테두리로 목록에서 바로 눈에 띄게, 사라짐은 채도를 뺀다 */
    .store-card.is-new {
      border-color: var(--status-new-ring);
      background: linear-gradient(to right, var(--status-new-ring) 3px, var(--surface) 3px);
    }
    .store-card.is-gone {
      opacity: 0.62;
      border-style: dashed;
      background: linear-gradient(to right, var(--status-gone-ring) 3px, var(--surface) 3px);
    }
    .store-card.is-gone .card-thumb img { filter: grayscale(1); }
    .store-card.is-gone:hover { opacity: 1; }
    .card-note { font-size: 11px; color: var(--text-3); }
    .store-card:active { transform: scale(0.985); }
    .store-card:focus-visible { outline: 2px solid var(--accent-color); outline-offset: 2px; }

    .card-thumb {
      flex-shrink: 0;
      width: 56px; height: 56px;
      border-radius: var(--radius-md);
      background: var(--chip-bg, var(--surface-2));
      overflow: hidden;
    }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .card-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
    .card-info h3 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-address {
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-2);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
    }
    .card-distance { font-size: 12px; font-weight: 700; color: var(--accent-color); }

    .sheet-more-button {
      display: block;
      width: 100%;
      padding: var(--space-md);
      margin: var(--space-sm) 0 var(--space-md);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text-2);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .sheet-more-button:hover { background: var(--surface-hover); color: var(--text); }

    /* ── 지도 팝업 ──────────────────────────────────────────── */
    .store-popup {
      position: relative;
      width: 300px;
      max-width: calc(100vw - 32px);
      padding: var(--space-lg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-raise);
      color: var(--text);
      animation: popup-in 0.18s var(--ease-sheet);
    }
    @keyframes popup-in { from { opacity: 0; transform: translateY(6px) scale(0.98); } }
    .popup-close {
      position: absolute;
      top: 10px; right: 10px;
      width: 28px; height: 28px;
      border: none;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--text-2);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .popup-close:hover { background: var(--border-strong); color: var(--text); }
    .store-popup h3 {
      margin-bottom: var(--space-sm);
      padding-right: 32px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .store-popup .badge-row { margin-bottom: var(--space-sm); }
    .store-popup p {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin: var(--space-xs) 0;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-2);
    }
    /* 상태 안내 띠. 왜 이 핀이 튀는지 팝업 안에서 바로 설명한다 */
    .popup-status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: var(--space-sm);
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: var(--chip-bg);
      color: var(--chip-fg);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
    }
    .store-popup a.popup-phone { color: inherit; text-decoration: none; }
    .store-popup a.popup-phone:hover { color: var(--accent-color); text-decoration: underline; }

    .popup-actions {
      display: flex;
      gap: var(--space-sm);
      margin-top: var(--space-md);
    }
    .popup-cta-button {
      display: block;
      flex: 1;
      padding: 12px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: var(--accent-color);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .popup-cta-button:hover { background: var(--accent-strong); transform: translateY(-1px); }
    .popup-cta-button:active { transform: translateY(0); }
    .popup-cta-button.secondary {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--text);
    }
    .popup-cta-button.secondary:hover { background: var(--surface-hover); }
    .store-popup .popup-links {
      margin-top: var(--space-md);
      padding-top: var(--space-sm);
      border-top: 1px solid var(--border);
    }
    .store-popup .popup-links p { margin: 2px 0; font-size: 12px; }
    .store-popup .popup-links a { color: var(--text-2); text-decoration: none; }
    .store-popup .popup-links a:hover { color: var(--accent-color); text-decoration: underline; }

    /* ── 부유 컨트롤 ────────────────────────────────────────── */
    .locate-button {
      position: fixed;
      right: var(--space-md);
      z-index: 1150;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px; height: 46px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      box-shadow: var(--shadow-raise);
      font-size: 19px;
      cursor: pointer;
      transition: bottom 0.4s var(--ease-sheet), opacity 0.25s ease, transform 0.1s ease;
    }
    .locate-button:active { transform: scale(0.94); }
    .locate-button.loading { animation: locate-pulse 1s ease-in-out infinite; }
    @keyframes locate-pulse { 50% { opacity: 0.4; } }

    #status {
      position: fixed;
      bottom: calc(var(--space-lg) + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 1300;
      max-width: calc(100vw - 32px);
      padding: 10px var(--space-lg);
      border-radius: var(--radius-pill);
      background: rgba(20, 23, 26, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      box-shadow: var(--shadow-raise);
      display: none;
    }

    /* ══ 모바일 (~1023px): 드래그 하단 시트 ══════════════════ */
    @media (max-width: 1023px) {
      .bottom-sheet.state-collapsed { transform: translateY(calc(100% - var(--sheet-collapsed-h))); }
      .bottom-sheet.state-peek { transform: translateY(calc(100% - 35vh)); }
      .bottom-sheet.state-half { transform: translateY(calc(100% - 55vh)); }
      .bottom-sheet.state-full { transform: translateY(0); }

      /* 시트 높이에 맞춰 내 위치 버튼을 띄운다. 시트가 다 열리면 숨김 */
      .locate-button { bottom: calc(35vh + var(--space-md)); }
      body[data-sheet="state-collapsed"] .locate-button { bottom: calc(var(--sheet-collapsed-h) + var(--space-md)); }
      body[data-sheet="state-half"] .locate-button { bottom: calc(55vh + var(--space-md)); }
      body[data-sheet="state-full"] .locate-button { opacity: 0; pointer-events: none; }

      #status { bottom: calc(35vh + var(--space-md) + 56px); }
    }

    /* 태블릿: 시트가 넓어 한 줄에 카드 하나면 공간이 남는다 */
    @media (min-width: 640px) and (max-width: 1023px) {
      .sheet-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 var(--space-md);
        align-content: start;
      }
      .sheet-empty, .sheet-more-button { grid-column: 1 / -1; }
      .top-nav { padding-left: var(--space-lg); padding-right: var(--space-lg); }
    }

    /* 좁은 화면에서는 필을 아이콘만 남겨 한 줄에 더 많이 보이게 */
    @media (max-width: 400px) {
      .category-pill { padding: 0 10px; font-size: 12px; }
    }

    /* ══ 데스크톱 (1024px~): 좌측 사이드바 + 지도 ═════════════ */
    @media (min-width: 1024px) {
      body {
        display: grid;
        grid-template-columns: var(--sidebar-w) 1fr;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .top-nav {
        position: static;
        grid-area: 1 / 1;
        align-items: stretch;
        gap: var(--space-md);
        padding: var(--space-lg) var(--space-lg) 0;
        background: var(--sheet-bg);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border-bottom: none;
        border-right: 1px solid var(--border);
      }

      .nav-brand { display: flex; align-items: center; gap: 10px; }
      .brand-mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px; height: 34px;
        border-radius: 10px;
        background: var(--accent-soft);
        font-size: 17px;
      }
      .brand-text { display: flex; flex-direction: column; line-height: 1.25; }
      .brand-text strong { font-size: 15px; font-weight: 800; letter-spacing: -0.03em; }
      .brand-text span { font-size: 11px; color: var(--text-3); }

      .floating-search { max-width: none; box-shadow: none; background: var(--surface); }
      /* 사이드바에서는 스크롤 대신 줄바꿈. 필터 9개를 한눈에 본다 */
      .category-pill-row {
        max-width: none;
        margin: 0 calc(-1 * var(--space-lg));
        padding: 0 var(--space-lg) var(--space-md);
        flex-wrap: wrap;
        overflow-x: visible;
        gap: 6px;
        mask-image: none;
        -webkit-mask-image: none;
      }
      .category-pill { min-height: 32px; padding: 0 10px; }

      .bottom-sheet {
        position: static;
        grid-area: 2 / 1;
        min-height: 0;
        max-height: none;
        padding: 0 var(--space-lg);
        border-radius: 0;
        border-right: 1px solid var(--border);
        box-shadow: none;
        transform: none;
        transition: none;
      }
      .sheet-handle { display: none; }
      .sheet-header { padding: var(--space-sm) 0 var(--space-md); }
      .sheet-content { padding: 0 0 var(--space-lg); }
      .store-card { margin-bottom: var(--space-md); }
      .card-thumb { width: 60px; height: 60px; }

      #map { grid-area: 1 / 2 / 3 / 3; }

      .locate-button { right: var(--space-xl); bottom: var(--space-xl); width: 44px; height: 44px; }
      #status { left: calc(50% + var(--sidebar-w) / 2); bottom: var(--space-xl); }
      .store-popup { width: 320px; }
    }

    @media (min-width: 1440px) {
      :root { --sidebar-w: 420px; }
      .store-card { padding: var(--space-lg) var(--space-md); }
    }

    /* ══ 다크 모드 ═══════════════════════════════════════════ */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0f12;
        --surface: #171a1f;
        --surface-2: #1f242b;
        --surface-hover: #232830;
        --text: #e8eaed;
        --text-2: #a3acb7;
        --text-3: #6f7883;
        --border: #262b33;
        --border-strong: #39404a;
        --accent-color: #ff6b5b;
        --accent-strong: #ff8a7d;
        --accent-soft: rgba(255, 107, 91, 0.16);
        --nav-bg: rgba(23, 26, 31, 0.82);
        --sheet-bg: #101318;
        --shadow-soft: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.35);
        --shadow-raise: 0 2px 6px rgba(0, 0, 0, 0.4), 0 14px 32px rgba(0, 0, 0, 0.5);
        --shadow-sheet: 0 -6px 28px rgba(0, 0, 0, 0.5);

        /* 링 색은 어두운 지도 위에서도 그대로 쓸 수 있을 만큼 진하다.
           칩 배경만 어두운 표면에 맞춰 낮춘다 */
        --status-new-bg: rgba(22, 163, 74, 0.22); --status-new-text: #4ADE80;
        --status-gone-bg: rgba(148, 163, 184, 0.20); --status-gone-text: #A8B4C2;
      }

      .category-pill.active .pill-count { background: rgba(255, 255, 255, 0.14); }
      .store-card.is-new { background: linear-gradient(to right, var(--status-new-ring) 3px, var(--surface) 3px); }

      /* 파스텔 배지는 어두운 표면에서 튄다. 같은 색상(hue)을 유지한 채
         밝기만 올리고 배경은 투명 틴트로 깔아 준다. --cat-*-bg 자체는
         지도 마커가 쓰므로 건드리지 않는다. */
      @supports (color: color-mix(in oklab, red, blue)) {
        .category-badge {
          background: color-mix(in oklab, var(--chip-fg, var(--text-2)) 20%, transparent);
          color: color-mix(in oklab, var(--chip-fg, var(--text-2)) 55%, white);
        }
        .card-thumb { background: color-mix(in oklab, var(--chip-fg, var(--text-3)) 18%, var(--surface)); }
        .category-pill.active {
          background: color-mix(in oklab, var(--chip-fg) 22%, var(--surface));
          color: color-mix(in oklab, var(--chip-fg) 55%, white);
          border-color: color-mix(in oklab, var(--chip-fg) 45%, transparent);
        }
      }

      .popup-cta-button { color: #12100f; }
      #status { background: rgba(240, 242, 245, 0.92); color: #14171a; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=608c740734f775a41a0b360ae3c5f32b&libraries=services,clusterer&autoload=false"></script>
  <script>
    // textContent -> innerHTML 방식은 " 와 ' 를 이스케이프하지 않는다. 이 값들이
    // href / class 같은 속성에 들어가므로 속성 구분자까지 직접 처리한다.
    var ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[&<>"']/g, function (ch) { return ESC_MAP[ch]; });
    }

    // 링크는 스크래핑한 값이라 신뢰할 수 없다. http(s) 만 통과시켜 javascript:
    // 같은 스킴이 href 에 들어가는 것을 막는다.
    function safeUrl(url) {
      if (url === null || url === undefined) return '';
      var raw = String(url).trim();
      return /^https?:\/\//i.test(raw) ? raw : '';
    }

    var markerCache = {};
    var cssVarCache = {};
    function getCssVar(varName) {
      // 값이 빈 문자열(정의되지 않은 카테고리 변수)이어도 캐시되도록 키 존재로 판단한다.
      if (!Object.prototype.hasOwnProperty.call(cssVarCache, varName)) {
        cssVarCache[varName] = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
      }
      return cssVarCache[varName];
    }

    // status 는 '' | 'new' | 'gone'.
    //   new  — 바깥에 초록 후광을 한 겹 두른다. 축소된 지도에서도 튄다.
    //   gone — 회색 원 + 점선 테두리 + 사선. 카테고리 색을 버리는 대신
    //          "지금은 없는 곳" 이라는 사실을 우선한다.
    function createEmojiMarkerImage(emoji, bgColor, size, status) {
      size = size || 48;
      status = status || '';
      var dpr = window.devicePixelRatio || 1;
      var cacheKey = emoji + '-' + bgColor + '-' + size + '-' + status + '-' + dpr;
      if (markerCache[cacheKey]) {
        return markerCache[cacheKey];
      }

      var isNew = status === 'new';
      var isGone = status === 'gone';
      var canvas = document.createElement('canvas');
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      var ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      var center = size / 2;
      // 후광 한 겹이 더 들어가므로 신규는 원을 그만큼 줄여야 잘리지 않는다.
      var ringWidth = size * 0.07;
      var radius = center - 4 - (isNew ? ringWidth : 0);

      ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 4;

      ctx.beginPath();
      ctx.arc(center, center, radius, 0, Math.PI * 2);
      ctx.fillStyle = isGone ? (getCssVar('--status-gone-fill') || '#E2E7EC') : bgColor;
      ctx.fill();

      // 그림자는 원 하나에만. 테두리·에모지까지 번지면 지저분해진다.
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      ctx.strokeStyle = 'white';
      ctx.lineWidth = 2;
      ctx.stroke();

      if (isNew) {
        ctx.beginPath();
        ctx.arc(center, center, radius + ringWidth / 2 + 1, 0, Math.PI * 2);
        ctx.strokeStyle = getCssVar('--status-new-ring') || '#16a34a';
        ctx.lineWidth = ringWidth;
        ctx.stroke();
      }

      var goneColor = getCssVar('--status-gone-ring') || '#94a3b8';
      if (isGone) {
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, Math.PI * 2);
        ctx.strokeStyle = goneColor;
        ctx.lineWidth = 1.5;
        ctx.setLineDash([size * 0.09, size * 0.07]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      ctx.globalAlpha = isGone ? 0.4 : 1;
      ctx.font = (size * 0.5) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, center, center);
      ctx.globalAlpha = 1;

      if (isGone) {
        var reach = radius * 0.66;
        // 흰 밑선을 먼저 깔아야 에모지 위에서도 사선이 끊겨 보이지 않는다.
        [['rgba(255,255,255,0.9)', size * 0.13], [goneColor, size * 0.07]].forEach(function (pair) {
          ctx.beginPath();
          ctx.moveTo(center - reach, center + reach);
          ctx.lineTo(center + reach, center - reach);
          ctx.strokeStyle = pair[0];
          ctx.lineWidth = pair[1];
          ctx.lineCap = 'round';
          ctx.stroke();
        });
      }

      var dataUrl = canvas.toDataURL();
      markerCache[cacheKey] = dataUrl;
      return dataUrl;
    }
    
    kakao.maps.load(function() {
      (function () {
        var mapContainer = document.getElementById('map'),
            mapOption = { 
                center: new kakao.maps.LatLng(37.535, 126.897),
                level: 13,
                maxZoom: 20
            };
        var map = new kakao.maps.Map(mapContainer, mapOption);
        
        // Use native grab cursor to eliminate slow CDN request for openhand.cur.ico
        map.setCursor('grab');

        kakao.maps.event.addListener(map, 'click', function () { closePopup(); });

        kakao.maps.event.addListener(map, 'idle', debouncedUpdateBottomSheet);

        // 기본 클러스터 아이콘은 파란 사각형이라 브랜드 색과 따로 논다.
        function clusterStyle(size, background) {

            color: '#fff',

          };
        }

        var clusterer = new kakao.maps.MarkerClusterer({
            map: map,
            averageCenter: true,

            calculator: [10, 30, 100],
            styles: [
              clusterStyle(38, 'rgba(231, 76, 60, 0.86)'),
              clusterStyle(46, 'rgba(231, 76, 60, 0.90)'),
              clusterStyle(56, 'rgba(192, 57, 43, 0.92)'),
              clusterStyle(66, 'rgba(192, 57, 43, 0.95)')
            ]
        });

        var categoryIcons = {
          "한식": "🍚",
          "양식": "🍝",
          "카페": "☕",
          "중식": "🍜",
          "뷰티": "💄",
          "일식": "🍣",
          "베이커리": "🍞",
          "서프샵": "🏄",
          "기타": "📌"
        };

        // 주간 갱신 diff. properties.status 는 consolidate.py 가 채운다.
        var STATUS_META = {
          'new':  { label: '신규',  emoji: '🆕', cls: 'st-new' },
          'gone': { label: '사라짐', emoji: '🚫', cls: 'st-gone' }
        };
        var STATUS_ORDER = ['new', 'gone'];

        var DEFAULT_CATEGORY = "기타";
        var SHEET_PAGE_SIZE = 50;

        var allMarkers = [];
        var activeCategories = new Set();
        var activeStatuses = new Set();
        var dataMeta = {};
        var searchTerm = "";
        var sheetLimit = SHEET_PAGE_SIZE;
        var sharedOverlay = new kakao.maps.CustomOverlay({
          zIndex: 1000
        });
        var sheet = document.getElementById('bottom-sheet');
        var sheetHandle = document.querySelector('.sheet-handle');
        var sheetStates = ['state-collapsed', 'state-peek', 'state-half', 'state-full'];
        var currentStateIndex = 1; // Start at peek
        var bottomSheetDebounceTimer;

        function debouncedUpdateBottomSheet() {
          clearTimeout(bottomSheetDebounceTimer);
          bottomSheetDebounceTimer = setTimeout(updateBottomSheet, 200);
        }

        function setSheetState(index) {
          currentStateIndex = Math.max(0, Math.min(index, sheetStates.length - 1));
          sheet.className = 'bottom-sheet ' + sheetStates[currentStateIndex];
          // 부유 버튼/토스트가 시트 높이를 따라가려면 상태를 CSS 에서도 알아야 한다
          document.body.dataset.sheet = sheetStates[currentStateIndex];
        }

        // Drag logic
        var isDragging = false;
        var dragMoved = false;
        var startY = 0;
        var startTranslateY = 0;
        // 1024px 이상은 좌측 사이드바 레이아웃이다. 시트가 아니므로 드래그하지 않는다.
        var isSidebar = window.matchMedia('(min-width: 1024px)');
        var SHEET_COLLAPSED_H = 76; // CSS 의 --sheet-collapsed-h 와 같은 값

        // WebKitCSSMatrix 는 비표준 별칭이고, 'none' 을 넘기면 예외를 던진다.
        var MatrixCtor = window.DOMMatrix || window.WebKitCSSMatrix;
        function getTranslateY(el) {
          var transform = window.getComputedStyle(el).transform;
          if (!MatrixCtor || !transform || transform === 'none') return 0;
          try {
            return new MatrixCtor(transform).f;
          } catch (e) {
            return 0;
          }
        }

        function setSheetTranslateY(y) {
          sheet.style.transform = 'translateY(' + y + 'px)';
        }

        function startDrag(e) {
          if (isSidebar.matches) return;
          isDragging = true;
          dragMoved = false;
          startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
          startTranslateY = getTranslateY(sheet);
          sheet.style.transition = 'none';
        }

        function onDrag(e) {
          if (!isDragging) return;
          if (e.cancelable) e.preventDefault();
          var currentY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
          var deltaY = currentY - startY;
          if (Math.abs(deltaY) > 5) dragMoved = true;
          var newTranslateY = Math.max(0, Math.min(window.innerHeight, startTranslateY + deltaY));
          setSheetTranslateY(newTranslateY);
        }

        function endDrag(e) {
          if (!isDragging) return;
          isDragging = false;
          sheet.style.transition = '';

          // 이동 없는 단순 클릭은 click 핸들러가 상태를 바꾸므로 여기선 건드리지 않음
          if (!dragMoved) {
            sheet.style.transform = '';
            return;
          }

          // 현재 보이는 높이와 가장 가까운 상태로 스냅
          var visible = sheet.offsetHeight - getTranslateY(sheet);
          var vh = window.innerHeight;
          var targets = [SHEET_COLLAPSED_H, 0.35 * vh, 0.55 * vh, sheet.offsetHeight];
          var best = 0;
          targets.forEach(function(t, i) {
            if (Math.abs(visible - t) < Math.abs(visible - targets[best])) best = i;
          });
          setSheetState(best);
          sheet.style.transform = '';
        }

        sheetHandle.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', endDrag);
        sheetHandle.addEventListener('touchstart', startDrag);
        window.addEventListener('touchmove', onDrag, { passive: false });
        window.addEventListener('touchend', endDrag);

        sheetHandle.addEventListener('click', function() {
          if (dragMoved || isSidebar.matches) return; // 드래그 직후 발생하는 클릭은 무시
          setSheetState((currentStateIndex + 1) % sheetStates.length);
        });

        sheetHandle.addEventListener('keydown', function(e) {
          if (isSidebar.matches) return;
          if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
            setSheetState((currentStateIndex + 1) % sheetStates.length);
          }
        });

        setSheetState(currentStateIndex);

        // 레이아웃이 바뀌면 (1) 드래그로 남은 인라인 transform 을 지우고
        // (2) 지도 컨테이너 크기가 달라졌으니 카카오맵에 다시 재도록 알린다.
        function onLayoutChange() {
          sheet.style.transform = '';
          sheet.style.transition = '';
          map.relayout();
        }
        if (isSidebar.addEventListener) {
          isSidebar.addEventListener('change', onLayoutChange);
        } else if (isSidebar.addListener) {
          isSidebar.addListener(onLayoutChange);
        }

        var resizeTimer;
        window.addEventListener('resize', function() {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function() { map.relayout(); }, 150);
        });



        var SOURCE_LABELS = { redtable: 'RedTable (메인)', ydp: '영등포구청', benepia: 'Benepia' };

        // properties.link 는 [{link, source}, ...] 형태의 JSON 문자열이다.
        // 파싱 결과를 정규화하고 안전하지 않은 URL 을 걸러 정렬해서 돌려준다.
        function getStoreLinks(p) {
          var links;
          try {
            links = JSON.parse(p.link || '[]');
          } catch (e) {
            links = [];
          }
          if (!Array.isArray(links)) return [];
          return links
            .map(function(l) {
              return { source: (l && l.source) || '', link: safeUrl(l && l.link) };
            })
            .filter(function(l) { return l.link; })
            .sort(function(a, b) {
              if (a.source === b.source) return 0;
              if (a.source === 'redtable') return -1;
              if (b.source === 'redtable') return 1;
              return a.source.localeCompare(b.source);
            });
        }

        function getPrimaryLink(p) {
          var links = getStoreLinks(p);
          return links.length ? links[0].link : null;
        }

        function getLinksHtml(p) {
          var links = getStoreLinks(p);
          if (!links.length) return '';
          var html = '<div class="popup-links">';
          links.forEach(function(l) {
            var label = SOURCE_LABELS[l.source] || esc(l.source) || '링크';
            html += '<p><a href="' + esc(l.link) + '" target="_blank" rel="noopener noreferrer">🔗 ' + label + '</a></p>';
          });
          return html + '</div>';
        }

        // 문자열 대신 DOM 노드를 만든다. 그래야 인라인 onclick 과 전역
        // window.isPopupClick 플래그 없이 이벤트 전파만 끊어서 처리할 수 있다.
        var POPUP_STOP_EVENTS = ['click', 'mousedown', 'touchstart', 'dblclick', 'wheel'];

        // "2026-09-10" -> "9월 10일". 연도가 다르면 연도까지 붙인다.
        function formatDay(iso) {
          var parts = String(iso || '').split('-');
          if (parts.length !== 3) return '';
          var thisYear = String(new Date().getFullYear());
          var month = Number(parts[1]), day = Number(parts[2]);
          if (!month || !day) return '';
          var text = month + '월 ' + day + '일';
          return parts[0] === thisYear ? text : parts[0] + '년 ' + text;
        }

        // short 는 카드용 한 줄. 팝업에서는 왜 그런지까지 풀어 쓴다.
        function statusText(p, short) {
          if (p.status === 'new') {
            var since = formatDay(p.first_seen);
            if (short) return since ? since + ' 추가' : '이번 갱신에 추가';
            return since ? since + ' 갱신에 새로 들어온 매장입니다' : '새로 들어온 매장입니다';
          }
          if (p.status === 'gone') {
            var last = formatDay(p.last_seen);
            if (short) return last ? last + ' 이후 목록에서 빠짐' : '목록에서 빠짐';
            return (last ? last + ' 이후 ' : '') + '제휴 목록에서 빠졌습니다. 방문 전 확인하세요';
          }
          return '';
        }

        function statusBadgeHtml(p) {
          var meta = STATUS_META[p.status];
          if (!meta) return '';
          return '<span class="category-badge ' + meta.cls + '">' + meta.emoji + ' ' + meta.label + '</span>';
        }

        function createPopupElement(feature) {
          var p = feature.properties;
          var categoriesHtml = statusBadgeHtml(p) + (p.categories || []).map(function(cat) {
            return '<span class="category-badge cat-' + esc(cat) + '">' + esc(cat) + '</span>';
          }).join('');

          var note = statusText(p);
          var meta = STATUS_META[p.status];
          var statusHtml = note
            ? '<div class="popup-status ' + meta.cls + '">' + meta.emoji + '<span>' + esc(note) + '</span></div>'
            : '';

          var link = getPrimaryLink(p);
          var coords = feature.geometry.coordinates;
          // 카카오맵 길찾기. 이름에 쉼표가 들어가면 좌표 파싱이 깨진다.
          var routeUrl = 'https://map.kakao.com/link/to/'
            + encodeURIComponent(String(p.title || '매장').replace(/,/g, ' '))
            + ',' + coords[1] + ',' + coords[0];

          var actions = '';
          if (link) {
            actions += '<a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer" class="popup-cta-button">방문하기</a>';
          }
          actions += '<a href="' + esc(routeUrl) + '" target="_blank" rel="noopener noreferrer" class="popup-cta-button secondary">길찾기</a>';

          var phoneHtml = '';
          if (p.phone) {
            var telHref = 'tel:' + String(p.phone).replace(/[^0-9+]/g, '');
            phoneHtml = '<p>📞 <a class="popup-phone" href="' + esc(telHref) + '">' + esc(p.phone) + '</a></p>';
          }

          var el = document.createElement('div');
          el.className = 'store-popup';
          el.innerHTML =
            '<button class="popup-close" type="button" aria-label="닫기">✕</button>' +
            '<h3>' + esc(p.title || 'Untitled') + '</h3>' +
            '<div class="badge-row">' + categoriesHtml + '</div>' +
            statusHtml +
            '<p>📍 ' + esc(p.address) + '</p>' +
            phoneHtml +
            getLinksHtml(p) +
            '<div class="popup-actions">' + actions + '</div>';

          // 팝업 내부 클릭이 지도 컨테이너까지 올라가면 지도의 click 핸들러가
          // 팝업을 닫아 버린다(링크 클릭이 먹지 않던 원인).
          POPUP_STOP_EVENTS.forEach(function(type) {
            el.addEventListener(type, function(e) { e.stopPropagation(); });
          });
          el.querySelector('.popup-close').addEventListener('click', function(e) {
            e.stopPropagation();
            closePopup();
          });
          return el;
        }

        function openPopup(marker, feature) {
          sharedOverlay.setContent(createPopupElement(feature));
          sharedOverlay.setPosition(marker.getPosition());
          sharedOverlay.setMap(map);
        }

        function closePopup() {
          sharedOverlay.setMap(null);
        }

        // 내 위치
        var userLatLng = null;
        var userMarker = null;
        var locateButton = document.getElementById('locate-button');

        locateButton.addEventListener('click', function() {
          if (!navigator.geolocation) {
            showStatus('이 브라우저에서는 위치 정보를 사용할 수 없습니다');
            return;
          }
          locateButton.classList.add('loading');
          navigator.geolocation.getCurrentPosition(function(pos) {
            locateButton.classList.remove('loading');
            userLatLng = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
            if (userMarker) userMarker.setMap(null);
            userMarker = new kakao.maps.CustomOverlay({
              position: userLatLng,
              content: '<div style="width:16px;height:16px;border-radius:50%;background:#4285F4;border:3px solid white;box-shadow:0 1px 6px rgba(0,0,0,0.3);"></div>',
              zIndex: 900
            });
            userMarker.setMap(map);
            map.setLevel(6);
            map.setCenter(userLatLng);
            updateBottomSheet();
          }, function() {
            locateButton.classList.remove('loading');
            showStatus('위치 정보를 가져오지 못했습니다. 권한을 확인해주세요.');
          }, { enableHighAccuracy: true, timeout: 10000 });
        });

        function showStatus(msg) {
          var status = document.getElementById('status');
          status.textContent = msg;
          status.style.display = 'block';
          setTimeout(function() { status.style.display = 'none'; }, 2500);
        }

        function formatDistance(km) {
          return km < 1 ? Math.round(km * 1000) + 'm' : km.toFixed(1) + 'km';
        }

        var fallbackLastModified = null;

        // 하드코딩된 날짜는 주간 갱신을 따라가지 못한다. consolidate.py 가
        // 넣어 주는 metadata.data_date 를 쓰고, 없으면 응답 헤더로 떨어진다.
        function showDataDate(value) {
          var el = document.getElementById('data-date');
          if (!el) return;
          el.style.display = '';
          // "2026-09-10" 은 Date 로 넘기면 UTC 자정으로 읽혀 시간대에 따라
          // 하루가 밀린다. 이미 날짜 문자열이면 그대로 쓴다.
          var plain = /^(\d{4}-\d{2}-\d{2})/.exec(String(value || ''));
          if (plain) {
            el.textContent = '데이터 기준: ' + plain[1];
            return;
          }
          var d = value ? new Date(value) : null;
          if (!d || isNaN(d.getTime())) {
            el.style.display = 'none';
            return;
          }
          var pad = function(n) { return String(n).padStart(2, '0'); };
          el.textContent = '데이터 기준: ' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }

        fetch('data/map_data.json')
          .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            // Last-Modified 는 배포 시각이라 데이터 기준일과 어긋난다.
            // metadata 가 없는 옛 파일만 헤더로 폴백한다.
            fallbackLastModified = res.headers.get('Last-Modified');
            return res.json();
          })
          .then(geojson => {
            document.getElementById('status').style.display = 'none';
            dataMeta = geojson.metadata || {};
            showDataDate(dataMeta.data_date || fallbackLastModified);

            // Normalize categories for all features
            geojson.features.forEach(feature => {
              var p = feature.properties;
              p.categories = String(p.category || '')
                .split(',')
                .map(s => s.trim())
                .filter(Boolean);
              if (!p.categories.length) p.categories = [DEFAULT_CATEGORY];
              if (!STATUS_META[p.status]) p.status = '';
            });

            // 같은 매장이 상호 표기·층수 차이로 두 번 들어오는 일이 있다.
            // 세 채널이 공유하는 링크의 매장 번호가 있으면 그걸 우선 키로 쓴다.
            var seen = new Set();
            geojson.features = geojson.features.filter(function(f) {
              var p = f.properties;
              var id = /\/(?:food|store)\/(\d+)/.exec(p.link || '');
              var key = id ? 'id:' + id[1] : (p.title || '') + '::' + (p.address || '');
              if (seen.has(key)) return false;
              seen.add(key);
              return true;
            });

            var urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('q')) {
              searchTerm = urlParams.get('q').toLowerCase();
              searchInput.value = searchTerm;
              clearSearch.style.display = 'block';
            }
            if (urlParams.has('cat')) {
              urlParams.get('cat').split(',').forEach(function(cat) {
                var trimmed = cat.trim();
                if (trimmed) activeCategories.add(trimmed);
              });
            }
            if (urlParams.has('status')) {
              urlParams.get('status').split(',').forEach(function(key) {
                var trimmed = key.trim();
                if (STATUS_META[trimmed]) activeStatuses.add(trimmed);
              });
            }

            geojson.features.forEach(feature => {
              var p = feature.properties;
              var latlng = new kakao.maps.LatLng(feature.geometry.coordinates[1], feature.geometry.coordinates[0]);
              
                var iconText = categoryIcons[p.categories[0]] || categoryIcons["기타"];
                var catColor = getCssVar('--cat-' + (p.categories[0] || '기타') + '-bg') || 'white';
                
                var markerSize = 48;
                // 앵커를 중앙에 고정해 hover로 커져도 위치가 틀어지지 않게 함
                function makeMarkerImage(size) {
                  return new kakao.maps.MarkerImage(
                    createEmojiMarkerImage(iconText, catColor, size, p.status),
                    new kakao.maps.Size(size, size),
                    { offset: new kakao.maps.Point(size / 2, size / 2) }
                  );
                }
                var marker = new kakao.maps.Marker({
                  position: latlng,
                  image: makeMarkerImage(markerSize),
                  // 겹칠 때 신규가 위로, 사라진 매장이 아래로 깔리게 한다
                  zIndex: p.status === 'new' ? 30 : (p.status === 'gone' ? 5 : 10)
                });

               kakao.maps.event.addListener(marker, 'mouseover', () => {
                 marker.setImage(makeMarkerImage(markerSize + 8));
               });
               kakao.maps.event.addListener(marker, 'mouseout', () => {
                 marker.setImage(makeMarkerImage(markerSize));
               });
               
               kakao.maps.event.addListener(marker, 'click', () => {
                 openPopup(marker, feature);
               });
               
               allMarkers.push({ marker, feature });
             });

              countStatuses();
              updateMarkers();
            })
           .catch(err => {
            var status = document.getElementById('status');
            status.textContent = '데이터를 불러오는 중 오류가 발생했습니다. 페이지를 새로고침 해주세요.';
            status.style.display = 'block';
            status.style.color = 'red';
          });

        function getDistance(latlng1, latlng2) {
          var R = 6371; // Earth radius in km
          var lat1 = latlng1.getLat() * Math.PI / 180;
          var lat2 = latlng2.getLat() * Math.PI / 180;
          var deltaLat = (latlng2.getLat() - latlng1.getLat()) * Math.PI / 180;
          var deltaLng = (latlng2.getLng() - latlng1.getLng()) * Math.PI / 180;
          var a = Math.sin(deltaLat / 2) * Math.sin(deltaLat / 2) +
                  Math.cos(lat1) * Math.cos(lat2) *
                  Math.sin(deltaLng / 2) * Math.sin(deltaLng / 2);
          var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
          return R * c;
        }

        // 검색어 + 카테고리 필터 판정. 지도 마커와 하단 목록이 같은 규칙을
        // 쓰도록 한곳에 둔다.
        function matchesSearch(p) {
          if (!searchTerm) return true;
          var title = (p.title || '').toLowerCase();
          var address = (p.address || '').toLowerCase();
          return title.indexOf(searchTerm) !== -1 || address.indexOf(searchTerm) !== -1;
        }

        function matchesCategory(p) {
          if (activeCategories.size === 0) return true;
          return (p.categories || []).some(function(cat) { return activeCategories.has(cat); });
        }

        function matchesStatus(p) {
          if (activeStatuses.size === 0) return true;
          return activeStatuses.has(p.status);
        }

        function matchesFilters(p) {
          return matchesSearch(p) && matchesCategory(p) && matchesStatus(p);
        }

        function hasActiveFilters() {
          return !!searchTerm || activeCategories.size > 0 || activeStatuses.size > 0;
        }

        // 목록 정렬: 신규 먼저, 사라진 매장은 맨 뒤. 그 안에서는 내 위치를
        // 알면 가까운 순, 모르면 이름순.
        var STATUS_WEIGHT = { 'new': 0, '': 1, 'gone': 2 };
        function compareStores(a, b) {
          var wa = STATUS_WEIGHT[a.feature.properties.status] ?? 1;
          var wb = STATUS_WEIGHT[b.feature.properties.status] ?? 1;
          if (wa !== wb) return wa - wb;
          if (userLatLng) return a.distanceKm - b.distanceKm;
          return (a.feature.properties.title || '').localeCompare(b.feature.properties.title || '', 'ko');
        }

        function updateBottomSheet() {
          var bounds = map.getBounds();
          var sheetContent = document.getElementById('sheet-content');
          sheetContent.innerHTML = '';
          var filtered = allMarkers.filter(function(m) {
            return matchesFilters(m.feature.properties) && bounds.contain(m.marker.getPosition());
          });

          if (userLatLng) {
            filtered.forEach(function(m) {
              m.distanceKm = getDistance(userLatLng, m.marker.getPosition());
            });
          }
          filtered.sort(compareStores);

          document.getElementById('sheet-store-count').textContent = filtered.length + '곳';

          if (filtered.length === 0) {
            var empty = document.createElement('div');
            empty.className = 'sheet-empty';
            empty.innerHTML =
              '<span class="empty-icon" aria-hidden="true">🔍</span>' +
              '<strong>표시할 매장이 없습니다</strong>' +
              '<span>지도를 옮기거나 검색어·필터를 바꿔 보세요</span>';
            if (hasActiveFilters()) {
              var resetBtn = document.createElement('button');
              resetBtn.type = 'button';
              resetBtn.className = 'pill-reset';
              resetBtn.textContent = '✕ 필터 초기화';
              resetBtn.onclick = resetFilters;
              empty.appendChild(resetBtn);
            }
            sheetContent.appendChild(empty);
            return;
          }

          var fragment = document.createDocumentFragment();
          filtered.slice(0, sheetLimit).forEach(m => {
            var p = m.feature.properties;
            var latlng = new kakao.maps.LatLng(m.feature.geometry.coordinates[1], m.feature.geometry.coordinates[0]);

            var categoriesHtml = (p.categories || []).map(cat =>
              '<span class="category-badge cat-' + esc(cat) + '">' + esc(cat) + '</span>'
            ).join('');

            var iconEmoji = categoryIcons[p.categories[0]] || categoryIcons["기타"];

            // <button> 을 그리드 아이템으로 두면 UA 가 내용을 shrink-wrap 해서
            // 태블릿 2단 레이아웃에서 카드 높이가 무너진다. div + role 로 간다.
            var card = document.createElement('div');
            var statusClass = p.status === 'new' ? ' is-new' : (p.status === 'gone' ? ' is-gone' : '');
            card.className = 'store-card cat-' + (p.categories[0] || DEFAULT_CATEGORY) + statusClass;
            card.setAttribute('role', 'button');
            card.tabIndex = 0;
            var catColor = getCssVar('--cat-' + (p.categories[0] || '기타') + '-bg') || 'white';
            var distanceHtml = userLatLng ? '<div class="card-distance">📍 ' + formatDistance(m.distanceKm) + '</div>' : '';
            var note = statusText(p, true);
            var noteHtml = note ? '<div class="card-note">' + esc(note) + '</div>' : '';
            card.innerHTML = '<div class="card-thumb"><img src="' + createEmojiMarkerImage(iconEmoji, catColor, 80, p.status) + '" alt=""></div>' +
                             '<div class="card-info">' +
                             '<h3>' + esc(p.title || 'Untitled') + '</h3>' +
                             '<div class="badge-row">' + statusBadgeHtml(p) + categoriesHtml + '</div>' +
                             '<p class="card-address">' + esc(p.address || '') + '</p>' +
                             noteHtml +
                             distanceHtml +
                             '</div>';
            card.onclick = (e) => {
              // 모바일에서 시트가 화면을 덮고 있으면 팝업이 가려진다
              if (!isSidebar.matches && currentStateIndex > 1) setSheetState(1);
              map.setCenter(latlng);
              map.setLevel(5);
              openPopup(m.marker, m.feature);
            };
            card.onkeydown = function(e) {
              if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                card.onclick();
              }
            };
            fragment.appendChild(card);
          });

          // 예전에는 50개에서 조용히 잘려 헤더의 개수와 목록이 어긋났다.
          if (filtered.length > sheetLimit) {
            var moreButton = document.createElement('button');
            moreButton.type = 'button';
            moreButton.className = 'sheet-more-button';
            moreButton.textContent = '더 보기 (' + (filtered.length - sheetLimit) + '개 남음)';
            moreButton.onclick = function() {
              sheetLimit += SHEET_PAGE_SIZE;
              updateBottomSheet();
            };
            fragment.appendChild(moreButton);
          }

          sheetContent.appendChild(fragment);
        }

        function syncUrl() {
          var params = new URLSearchParams();
          if (searchTerm) params.set('q', searchTerm);
          if (activeCategories.size > 0) params.set('cat', Array.from(activeCategories).join(','));
          if (activeStatuses.size > 0) params.set('status', Array.from(activeStatuses).join(','));
          var query = params.toString();
          // pushState 는 디바운스마다 히스토리를 쌓아 뒤로가기를 망가뜨린다.
          window.history.replaceState({}, '', window.location.pathname + (query ? '?' + query : ''));
        }

        function updateMarkers() {
          syncUrl();
          sheetLimit = SHEET_PAGE_SIZE; // 필터가 바뀌면 목록을 처음부터 보여준다

          clusterer.clear();
          var filtered = allMarkers.filter(function(m) { return matchesFilters(m.feature.properties); });
          clusterer.addMarkers(filtered.map(m => m.marker));
          
          if (filtered.length > 0) {
            var bounds = new kakao.maps.LatLngBounds();
            filtered.forEach(m => bounds.extend(m.marker.getPosition()));
            map.setBounds(bounds);
          } else {
            showStatus('검색 결과가 없습니다');
          }
          
          updateBottomSheet();
          renderFilterPills();
          renderUpdateSummary();
        }

        function toggleStatus(key) {
          if (activeStatuses.has(key)) {
            activeStatuses.delete(key);
          } else {
            activeStatuses.add(key);
          }
          updateMarkers();
        }

        function resetFilters() {
          activeCategories.clear();
          activeStatuses.clear();
          searchTerm = '';
          searchInput.value = '';
          clearSearch.style.display = 'none';
          updateMarkers();
        }



        // 데이터 전체 기준 상태별 개수. 필터를 걸어도 흔들리지 않아야
        // '이번 갱신에 무엇이 바뀌었나' 를 계속 보여줄 수 있다.
        var totalStatusCounts = { 'new': 0, 'gone': 0 };
        function countStatuses() {
          totalStatusCounts = { 'new': 0, 'gone': 0 };
          allMarkers.forEach(function(m) {
            var status = m.feature.properties.status;
            if (totalStatusCounts[status] !== undefined) totalStatusCounts[status] += 1;
          });
        }

        function makePill(className, emoji, label, count, isActive, onToggle) {
          var pill = document.createElement('button');
          pill.type = 'button';
          pill.className = 'category-pill ' + className + (isActive ? ' active' : '');
          pill.setAttribute('aria-pressed', isActive);
          pill.innerHTML = '<span class="pill-emoji" aria-hidden="true">' + emoji + '</span>' +
                           '<span class="pill-label">' + esc(label) + '</span>' +
                           '<span class="pill-count">' + count + '</span>';
          pill.onclick = onToggle;
          return pill;
        }

        function renderFilterPills() {
          var pillRow = document.getElementById('category-pill-row');
          pillRow.innerHTML = '';

          // 상태 개수는 카테고리 필터 기준, 카테고리 개수는 상태 필터 기준으로
          // 센다. 그래야 "신규만 보기" 상태에서 카테고리 숫자가 신규를 가리킨다.
          var statusCounts = {};
          var catCounts = {};
          allMarkers.forEach(function(m) {
            var p = m.feature.properties;
            if (!matchesSearch(p)) return;
            if (matchesCategory(p) && p.status) {
              statusCounts[p.status] = (statusCounts[p.status] || 0) + 1;
            }
            if (matchesStatus(p)) {
              (p.categories || []).forEach(function(cat) {
                catCounts[cat] = (catCounts[cat] || 0) + 1;
              });
            }
          });

          var hasStatusPills = false;
          STATUS_ORDER.forEach(function(key) {
            // 데이터에 없는 상태는 필터로 내지 않는다
            if (!totalStatusCounts[key]) return;
            hasStatusPills = true;
            var meta = STATUS_META[key];
            pillRow.appendChild(makePill(
              meta.cls, meta.emoji, meta.label, statusCounts[key] || 0,
              activeStatuses.has(key),
              function() { toggleStatus(key); }
            ));
          });

          if (hasStatusPills) {
            var divider = document.createElement('span');
            divider.className = 'pill-divider';
            divider.setAttribute('aria-hidden', 'true');
            pillRow.appendChild(divider);
          }

          Object.keys(categoryIcons).forEach(function(cat) {
            // 매장 하나가 여러 카테고리를 가질 수 있고 필터도 Set 이므로
            // 단일 선택으로 묶어 둘 이유가 없다. 개별 토글로 동작시킨다.
            pillRow.appendChild(makePill(
              'cat-' + cat, categoryIcons[cat], cat, catCounts[cat] || 0,
              activeCategories.has(cat),
              function() {
                if (activeCategories.has(cat)) {
                  activeCategories.delete(cat);
                } else {
                  activeCategories.add(cat);
                }
                updateMarkers();
              }
            ));
          });

          if (hasActiveFilters()) {
            var reset = document.createElement('button');
            reset.type = 'button';
            reset.className = 'pill-reset';
            reset.textContent = '✕ 필터 초기화';
            reset.onclick = resetFilters;
            pillRow.appendChild(reset);
          }
        }

        // 지도를 보기 전에 "이번 주에 뭐가 달라졌는지" 부터 알려 준다.
        function renderUpdateSummary() {
          var el = document.getElementById('update-summary');
          var newCount = totalStatusCounts['new'];
          var goneCount = totalStatusCounts['gone'];
          if (!newCount && !goneCount) {
            el.hidden = true;
            return;
          }
          el.hidden = false;
          el.innerHTML = '';

          var label = document.createElement('span');
          label.className = 'summary-label';
          label.textContent = '이번 갱신';
          el.appendChild(label);

          STATUS_ORDER.forEach(function(key) {
            var count = totalStatusCounts[key];
            if (!count) return;
            var meta = STATUS_META[key];
            var chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'summary-chip ' + meta.cls;
            chip.setAttribute('aria-pressed', activeStatuses.has(key));
            chip.textContent = meta.emoji + ' ' + meta.label + ' ' + count + '곳';
            chip.title = meta.label + ' 매장만 보기';
            chip.onclick = function() { toggleStatus(key); };
            el.appendChild(chip);
          });
        }

        var searchInput = document.getElementById('search-input');
        var clearSearch = document.getElementById('clear-search');
        var debounceTimer;

        

        searchInput.oninput = (e) => {
          clearSearch.style.display = e.target.value ? 'block' : 'none';
          
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            searchTerm = e.target.value.toLowerCase();
            updateMarkers();
          }, 300);
        };

        clearSearch.onclick = () => {
          searchInput.value = '';
          clearSearch.style.display = 'none';
          searchTerm = '';
          updateMarkers();
        };

        // 키보드: '/' 로 검색창, Esc 로 팝업 닫기 → 검색어 비우기
        document.addEventListener('keydown', function(e) {
          var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
          if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey) {
            e.preventDefault();
            searchInput.focus();
            searchInput.select();
            return;
          }
          if (e.key !== 'Escape') return;
          if (sharedOverlay.getMap()) {
            closePopup();
          } else if (typing && searchInput.value) {
            clearSearch.onclick();
          }
        });
      })();
    });
  </script>
</body>
</html>

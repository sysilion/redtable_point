name: Weekly Data Update and Deploy

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 0시
  workflow_dispatch: # 수동 실행 가능

# 이전 실행이 아직 돌고 있으면 겹치지 않게 한다.
concurrency:
  group: weekly-data-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 수집기는 결과가 비면 0이 아닌 코드로 종료한다. 한 채널이라도 실패하면
      # 반쪽짜리 지도를 배포하는 대신 잡을 실패시키고 지난주 데이터를 유지한다.
      - name: Run collection scripts
        run: |
          python collectors/redtable.py
          python collectors/ydp.py
          python collectors/benepia.py

      - name: Consolidate data
        env:
          GOODS_TOOLS_DIR: .
        run: python scripts/consolidate.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/map_data.json scripts/.geocode_cache.json
          if git diff --cached --quiet; then
            echo "변경 사항이 없어 커밋을 건너뜁니다."
            exit 0
          fi
          git commit -m "chore: weekly data update"
          git push
